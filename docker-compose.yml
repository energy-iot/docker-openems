version: '3.9'
services:
  openems-ui:
    build: 
      context: ./openems-ui
    image: openems-ui:latest
    ports:
      - "4200:8089"
    
  openems-backend:
    build: 
      context: ./openems-backend
    image: openems-backend:latest
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: openems
      DB_USER: odoo
      DB_PASSWORD: Icui4cyou
    ports:
      - "8075:8075"  # B2B REST API (meter discovery)
      - "8079:8079"
      - "8081:8081"
      - "8082:8082"
    depends_on:
      influxdb:
        condition: service_healthy

  openems-edge:
    build:
      context: ./openems-edge
    image: openems-edge:latest
    ports:
      - "8080:8080"  # Edge Felix console
      - "8085:8085"  # Edge Controller.Api.Websocket for UI
    volumes:
      - ./openems-edge/config.d:/etc/openems.d

  # InfluxDB — timedata persistence for the OpenEMS backend.
  # Stores historical energy data (measurements, meter readings, etc.)
  # in a named volume (influxdb-data) so data survives container restarts.
  #
  # Verify data is flowing:
  #   curl http://localhost:8086/query --data-urlencode "q=SHOW MEASUREMENTS ON openemsdb"
  influxdb:
    image: influxdb:1.8
    restart: unless-stopped
    environment:
      INFLUXDB_DB: openemsdb
      INFLUXDB_HTTP_AUTH_ENABLED: "false"
    ports:
      - "127.0.0.1:8086:8086"
    volumes:
      - influxdb-data:/var/lib/influxdb
    healthcheck:
      test: ["CMD", "influx", "-execute", "SHOW DATABASES"]
      interval: 10s
      timeout: 5s
      retries: 5

  db:
    build: 
      context: ./odoo-database
    image: odoo-db
    user: root
    environment:
      - POSTGRES_USER=odoo
      - POSTGRES_PASSWORD=Icui4cyou      
      - POSTGRES_DB=postgres
    restart: always             # run as a service
    volumes:
        - ./postgresql:/var/lib/postgresql

  odoo16:
    build: 
      context: ./odoo
    image: odoo
    user: root
    depends_on:
      - db
    ports:
      - "10016:8069"
      - "20016:8072" # live chat
    tty: true
    command: --
    environment:
      - HOST=db
      - USER=odoo
      - PASSWORD=Icui4cyou
    volumes:
      #- /etc/timezone:/etc/timezone:ro
      #- /etc/localtime:/etc/localtime:ro
      # - ./entrypoint.sh:/entrypoint.sh   # if you want to install additional Python packages, uncomment this line!
      - ./odoo/addons:/mnt/extra-addons
      - ./etc:/etc/odoo
    restart: always 

    

