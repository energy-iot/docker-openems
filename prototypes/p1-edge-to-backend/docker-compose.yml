services:
  # Persistence layer. The backend's Timedata.InfluxDB component writes every
  # edge's telemetry here, so history survives a restart and is queryable back
  # out of the backend (the old Timedata.Dummy accepted data but discarded it).
  #
  # InfluxDB v2, auto-bootstrapped from DOCKER_INFLUXDB_INIT_* on first boot:
  # no manual `influx setup` / token-copying — the org, bucket and a *pinned*
  # dev token are created automatically so the whole stack comes up from a
  # single `docker compose up`. The token below is baked into the backend's
  # Timedata config; it is a throwaway dev credential — rotate for any real use.
  influxdb:
    image: influxdb:2.7-alpine
    container_name: openems-influxdb
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: openems
      DOCKER_INFLUXDB_INIT_PASSWORD: openems-admin-pw
      DOCKER_INFLUXDB_INIT_ORG: openems.io
      DOCKER_INFLUXDB_INIT_BUCKET: openems
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: openems-p1-dev-token
    volumes:
      - influxdb-data:/var/lib/influxdb2   # durable storage (named volume)
    ports:
      - "8086:8086"   # InfluxDB UI/API — handy for poking at stored data directly
    restart: unless-stopped

  openems-backend:
    depends_on:
      - influxdb
    build:
      context: ./backend
      # 2026.1.0 = last monolithic backend (single jar opens the :8081 edge
      # websocket). 2026.2.0+ split this into edge.manager + an unpublished
      # edge.application gateway, so the released backend jar no longer
      # accepts edge connections on its own. See README.
      args:
        OPENEMS_VERSION: "2026.1.0"
    image: openems-backend:2026.1.0
    container_name: openems-backend
    ports:
      - "8081:8081"   # Edge  <-> Backend websocket
      - "8082:8082"   # UI/probe <-> Backend websocket
    volumes:
      # Edge registry for Metadata.File — the backend reads this at startup to
      # decide which apikeys to accept (mounted, not baked into the image, so
      # register-edge.sh can edit it on the host; restart the backend to reload).
      - ./backend/registry:/opt/openems-backend/registry:ro
    restart: unless-stopped

  # Official OpenEMS web UI (nginx serving the Angular app + reverse-proxying the
  # UI websocket). Version-matched to the 2026.1.0 backend on purpose: the 2026.2
  # auth-flow changes would otherwise break login. Open http://localhost:8080
  openems-ui:
    image: openems/ui-backend:2026.1.0
    container_name: openems-ui
    depends_on:
      - openems-backend
    environment:
      WEBSOCKET_HOST: openems-backend
      WEBSOCKET_PORT: "8082"
      REST_PORT: "8084"
    volumes:
      # custom nginx template: adds a resolver + variable proxy_pass so the UI
      # survives a backend container recreate without a manual restart
      - ./ui/80-openems.conf.tpl:/etc/nginx/site-confs/80-openems.conf.tpl:ro
    ports:
      - "8080:80"
    restart: unless-stopped

volumes:
  influxdb-data:   # persists stored telemetry across `docker compose down`/up

# The edge "sites" live in docker-compose.override.yml, generated by:
#     ./scale-edges.sh 5
# docker compose auto-merges the override, so `docker compose up` brings up the
# backend + however many edges you generated.
