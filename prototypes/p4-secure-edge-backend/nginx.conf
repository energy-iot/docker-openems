events {}

http {
  # TLS-terminating reverse proxy in front of the OpenEMS backend's edge
  # websocket (:8081). Edges connect here over wss:// + mTLS instead of plain ws.
  server {
    listen 8443 ssl;

    # --- server identity (so the edge can verify it's the real backend) ---
    ssl_certificate     /etc/nginx/certs/server.crt;
    ssl_certificate_key /etc/nginx/certs/server.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # --- mTLS: require + verify a client cert signed by our CA ---
    # Without a valid client cert, nginx refuses the request (status 400).
    ssl_client_certificate /etc/nginx/certs/ca.crt;
    ssl_verify_client      on;

    location / {
      proxy_pass http://openems-backend:8081;   # plaintext, stays inside Docker
      proxy_http_version 1.1;
      # WebSocket upgrade
      proxy_set_header Upgrade    $http_upgrade;
      proxy_set_header Connection "upgrade";
      proxy_set_header Host       $host;
      # surface the verified client identity to the backend (informational)
      proxy_set_header X-Client-Cert-CN $ssl_client_s_dn;
      proxy_read_timeout 86400;   # edge connection is long-lived
      # the edge's "Apikey" header is a custom header → forwarded automatically
    }
  }
}
