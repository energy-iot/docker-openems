name: Deploy Pipeline

on:
  workflow_dispatch:

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1
  # The three images that make up the AWS stack. Edges are NOT deployed to
  # AWS — they run in the field (or locally for dev) and connect in.
  IMAGE_NAME_UI: openems-ui
  IMAGE_NAME_BACKEND: openems-backend
  IMAGE_NAME_ODOO: odoo
  ECS_TD: .github/workflows/openems-deployment-td.json
  ECS_SERVICE: openems-deployment-service
  ECS_CLUSTER: openems-deployment-cluster

jobs:
  # Build AWS infrastructure
  deploy_aws_infrastructure:
    name: Build AWS infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.1

      - name: Run Terraform initialize
        working-directory: ./iac
        run: terraform init

      - name: Run Terraform apply
        working-directory: ./iac
        run: terraform apply -auto-approve

  # Create ECR repositories if missing
  create_ecr_repository:
    name: Create ECR repositories
    needs:
      - deploy_aws_infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Create ECR repositories
        env:
          REPO_NAMES: '${{ env.IMAGE_NAME_UI }},${{ env.IMAGE_NAME_BACKEND }},${{ env.IMAGE_NAME_ODOO }}'
        run: |
          IFS=',' read -ra REPOS <<< "$REPO_NAMES"
          for repo in "${REPOS[@]}"; do
            if aws ecr describe-repositories --repository-names "$repo" >/dev/null 2>&1; then
              echo "Repository $repo already exists."
            else
              aws ecr create-repository --repository-name "$repo"
              echo "Repository $repo created."
            fi
          done

  # Build, scan and push Docker images
  build_scan_push:
    name: Build, scan and push Docker images to ECR
    needs:
      - deploy_aws_infrastructure
      - create_ecr_repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v1

      - name: Build images from Docker Compose
        run: |
          docker compose build ${{ env.IMAGE_NAME_UI }} ${{ env.IMAGE_NAME_BACKEND }} odoo16

      - name: Run Trivy vulnerability scanner (ui)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/library/${{ env.IMAGE_NAME_UI }}:latest'
          format: 'sarif'
          output: 'trivy-results-ui.sarif'

      - name: Run Trivy vulnerability scanner (backend)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/library/${{ env.IMAGE_NAME_BACKEND }}:latest'
          format: 'sarif'
          output: 'trivy-results-backend.sarif'

      - name: Run Trivy vulnerability scanner (odoo)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'docker.io/library/${{ env.IMAGE_NAME_ODOO }}:latest'
          format: 'sarif'
          output: 'trivy-results-odoo.sarif'

      - name: Retag and push Docker images to Amazon ECR
        run: |
          chmod +x ./push-to-ecr.sh
          ./push-to-ecr.sh

  # Register a new task definition revision and redeploy the service.
  # NOTE: iac/ecs.tf is the source of truth for the task definition's
  # structure; this job only stamps fresh image URIs onto the rendered JSON.
  create_td_revision_restart_ecs:
    name: Create new task definition revision and restart ECS
    needs:
      - deploy_aws_infrastructure
      - create_ecr_repository
      - build_scan_push
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render task definition (ui image)
        id: render-ui-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ env.ECS_TD }}
          container-name: openems-deployment-container-ui
          image: ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_NAME_UI }}:latest

      - name: Render task definition (backend image)
        id: render-backend-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-ui-container.outputs.task-definition }}
          container-name: openems-deployment-container-backend
          image: ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_NAME_BACKEND }}:latest

      - name: Render task definition (odoo image)
        id: render-odoo-container
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: ${{ steps.render-backend-container.outputs.task-definition }}
          container-name: openems-deployment-container-odoo
          image: ${{ secrets.ECR_REGISTRY }}/${{ env.IMAGE_NAME_ODOO }}:latest

      - name: Deploy to Amazon ECS service
        uses: aws-actions/amazon-ecs-deploy-task-definition@v1
        with:
          task-definition: ${{ steps.render-odoo-container.outputs.task-definition }}
          service: ${{ env.ECS_SERVICE }}
          cluster: ${{ env.ECS_CLUSTER }}
