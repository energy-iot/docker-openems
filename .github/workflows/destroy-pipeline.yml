name: Destroy Pipeline

# Manual-only, with a typed confirmation. This pipeline destroys the entire
# OpenEMS AWS stack (ECS cluster, VPC, RDS, ...). It must NEVER run on push.
on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: 'Type the cluster name (openems-deployment-cluster) to confirm destruction'
        required: true
        type: string

env:
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  AWS_REGION: us-east-1

jobs:
  destroy_aws_infrastructure:
    name: Destroy AWS infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Verify confirmation input
        if: inputs.confirm_destroy != 'openems-deployment-cluster'
        run: |
          echo "::error::Confirmation mismatch — you typed '${{ inputs.confirm_destroy }}'. Aborting."
          exit 1

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.14.1

      - name: Run Terraform initialize
        working-directory: ./iac
        run: terraform init

      - name: Run Terraform destroy
        working-directory: ./iac
        run: terraform destroy -auto-approve
